replicaCount: 1

image:
  repository: registry.dawninternet.net/dawn-foundation/dev_pendle_balance_fetcher
  pullPolicy: Always
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Plain (non-secret) settings. The service exits at startup unless PENDLE_SY,
# PENDLE_YT and PENDLE_MARKETS are set (src/configuration.ts).
env:
  PORT: "8080"
  CHAIN_ID: "8453"
  # PENDLE_SY: ""
  # PENDLE_YT: ""
  # PENDLE_MARKETS: "0xmarket:deployedBlock[,0xmarket2:block2]"

# Secrets (BASE_RPC) come from this Secret (External Secrets / Vault).
secretName: pendle-balance-fetcher-secrets

# Reloader: rolling-restart when the secret changes.
deploymentAnnotations:
  reloader.stakater.com/auto: "true"

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}

# uid 1000 is the `node` user of the node:20-alpine base image.
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    cpu: "1"
    memory: 512Mi

# /health only reports that the HTTP server is up; it does not touch the RPC.
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

terminationGracePeriodSeconds: 30

volumes:
  - name: tmp
    emptyDir: {}
volumeMounts:
  - name: tmp
    mountPath: /tmp

nodeSelector: {}
tolerations: []
affinity: {}
