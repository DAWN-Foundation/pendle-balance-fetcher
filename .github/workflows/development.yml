name: DEV Build and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  build-and-publish:
    runs-on: [self-hosted]
    timeout-minutes: 60
    env:
      REPOSITORY: registry.dawninternet.net/dawn-foundation
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Login to Dawn Internet Container Registry
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2
        with:
          registry: registry.dawninternet.net
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # Build on the in-cluster rootless BuildKit instead of a local docker
          # daemon, so the runner no longer needs a privileged dind sidecar.
          driver: remote
          endpoint: tcp://buildkitd.buildkit.svc.cluster.local:12345

      - name: Build and Push to Dawn Internet Container Registry
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          file: ./Dockerfile
          context: .
          push: true
          cache-from: type=registry,ref=${{env.REPOSITORY}}/pendle_balance_fetcher:buildcache
          cache-to: type=registry,ref=${{env.REPOSITORY}}/pendle_balance_fetcher:buildcache,mode=max
          tags: ${{env.REPOSITORY}}/dev_pendle_balance_fetcher:${{ github.run_number }}

  dev-deploy:
    runs-on: [self-hosted]
    timeout-minutes: 60
    needs: build-and-publish
    steps:
      - name: Generate cd-dawn token (GitHub App)
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: gitops
        with:
          app-id: ${{ secrets.CD_DAWN_APP_ID }}
          private-key: ${{ secrets.CD_DAWN_APP_KEY }}
          owner: DAWN-Foundation
          repositories: cd-dawn

      - name: Clone gitops repository (cd-dawn)
        run: git clone https://x-access-token:${{ steps.gitops.outputs.token }}@github.com/DAWN-Foundation/cd-dawn.git

      # DAW-20: pinned and checksum-verified. This previously pulled
      # releases/latest with no integrity check, so the binary could change
      # without notice and nothing would detect a substituted artefact. It
      # matters more here than it looks: the next steps run this binary and
      # then push to cd-dawn with a GitHub App token, and cd-dawn auto-syncs
      # to the cluster - so a bad yq reaches production.
      # sha256 cross-checked against yq's own published checksums file.
      - name: Install yq
        run: |
          set -euo pipefail
          YQ_VERSION=v4.53.6
          YQ_SHA256=c5f056448f973ae7d39b5401949648a78f2dc1947d6a8eb65be60d5c504b9385
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o ./yq
          echo "${YQ_SHA256}  ./yq" | sha256sum -c -
          chmod +x ./yq
        working-directory: cd-dawn

      - name: Update image tag
        run: ./yq e '.image.tag = "${{ github.run_number }}"' -i apps/services/pendle-balance-fetcher-dev/values.yaml
        working-directory: cd-dawn

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/services/pendle-balance-fetcher-dev/values.yaml
          git commit -m "pendle-balance-fetcher dev -> ${{ github.run_number }}" || { echo "no changes"; exit 0; }
          git push origin HEAD:main
        working-directory: cd-dawn

