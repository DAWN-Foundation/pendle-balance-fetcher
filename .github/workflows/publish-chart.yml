name: Publish Helm Chart

# ArgoCD pulls this chart from the OCI registry at a pinned targetRevision, so a
# chart change only reaches the cluster once it is packaged, pushed, and the
# Application's targetRevision in cd-dawn is moved. This workflow covers the first two.

on:
  push:
    branches: [main]
    paths:
      - 'helm/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: registry.dawninternet.net
  PROJECT: dawn-foundation-helm
  CHART_DIR: helm/pendle-balance-fetcher
  CHART_NAME: pendle-balance-fetcher

jobs:
  publish:
    runs-on: [self-hosted]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.3

      - name: Read chart version
        id: chart
        run: |
          set -euo pipefail
          version=$(helm show chart "${CHART_DIR}" | awk '/^version:/ {print $2}')
          if [ -z "$version" ]; then echo "could not read version from ${CHART_DIR}/Chart.yaml" >&2; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Chart version: $version"

      - name: Log in to the registry
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.DOCKER_PASSWORD }}" \
            | helm registry login "${REGISTRY}" -u "${{ secrets.DOCKER_USER }}" --password-stdin

      # Publishing over an existing version is what makes this silently useless:
      # the push appears to succeed while ArgoCD keeps serving the old content.
      # Fail loudly instead and require a Chart.yaml bump.
      - name: Refuse to overwrite an existing version
        run: |
          set -euo pipefail
          v='${{ steps.chart.outputs.version }}'
          if helm show chart "oci://${REGISTRY}/${PROJECT}/${CHART_NAME}" --version "$v" >/dev/null 2>&1; then
            echo "::error::${CHART_NAME} ${v} is already published. Bump version in ${CHART_DIR}/Chart.yaml." >&2
            exit 1
          fi
          echo "${CHART_NAME} ${v} is not published yet - proceeding."

      - name: Package and push
        run: |
          set -euo pipefail
          helm package "${CHART_DIR}" -d dist
          helm push "dist/${CHART_NAME}-${{ steps.chart.outputs.version }}.tgz" \
            "oci://${REGISTRY}/${PROJECT}"

      - name: Summary
        run: |
          v='${{ steps.chart.outputs.version }}'
          {
            echo "### Published \`${CHART_NAME}\` \`${v}\`"
            echo ""
            echo "\`oci://${REGISTRY}/${PROJECT}/${CHART_NAME}\` version \`${v}\`"
            echo ""
            echo "This is **not deployed yet**. ArgoCD pins a version, so update"
            echo "\`targetRevision\` to \`${v}\` in the cd-dawn Applications for this service."
          } >> "$GITHUB_STEP_SUMMARY"
